name: decode-tradevane
on:
  push:
    paths: ['b64tv/done']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat $(ls b64tv/tv.part* | sort) | base64 -d > /tmp/tv.tgz
          rm -rf tradevane && tar xzf /tmp/tv.tgz && touch .nojekyll
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A tradevane .nojekyll && git commit -m "decode tradevane" && git push
