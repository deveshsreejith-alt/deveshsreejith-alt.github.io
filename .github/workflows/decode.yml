name: decode
on:
  push:
    paths: ['b64/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat $(ls b64/site.b64.part* | sort) | base64 -d > /tmp/site.tgz
          tar xzf /tmp/site.tgz && touch .nojekyll
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A . ':!b64' && git commit -m "decode build" && git push
