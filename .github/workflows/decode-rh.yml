name: decode-roomhustle
on:
  push:
    paths: ['b64rh/done']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat $(ls b64rh/rh.part* | sort) | base64 -d > /tmp/rh.tgz
          rm -rf roomhustle && tar xzf /tmp/rh.tgz && touch .nojekyll
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A roomhustle .nojekyll && git commit -m "decode roomhustle" && git push
